name: ordenalink-prod

services:
  api:
    build:
      context: .
      target: prod
    env_file: .env
    environment:
      # Producción siempre usa Atlas
      MONGODB_URI: ${MONGODB_URI_ATLAS:?Define MONGODB_URI_ATLAS en .env}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
