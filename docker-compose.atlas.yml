# Modo Atlas (make up-atlas): se aplica encima de docker-compose.yml.
# La API y DbGate usan el MONGODB_URI del .env y no se levanta el Mongo local.
services:
  api:
    environment:
      MONGODB_URI: ${MONGODB_URI:?Define MONGODB_URI en .env}
    depends_on: !reset {}

  dbgate:
    environment:
      CONNECTIONS: atlas
      LABEL_atlas: Mongo Atlas
      URL_atlas: ${MONGODB_URI:?Define MONGODB_URI en .env}
      ENGINE_atlas: mongo@dbgate-plugin-mongo
    depends_on: !reset {}
